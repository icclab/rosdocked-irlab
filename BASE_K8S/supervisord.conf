[supervisord]
user=ros
nodaemon=true
loglevel=info
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:entrypoint]
command=/etc/entrypoint.sh
# `logfile`/`pidfile` are not valid [program:] options -- supervisor silently
# ignored them, so with stdout_logfile defaulting to AUTO everything the
# entrypoint printed (driver version match, the software-rendering warning) went
# to a randomly named /tmp/entrypoint-stdout---supervisor-XXXX.log inside the
# container and never appeared in `kubectl logs`. /dev/fd/1 with maxbytes=0 is the
# supervisor-in-a-container idiom; plain /dev/stdout is unreliable here.
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stopsignal=INT
autostart=true
autorestart=true
redirect_stderr=true
priority=1

[program:pulseaudio]
user=ros
command=bash -c "sudo kill $(pidof pulseaudio) >/dev/null 2>&1 || sudo /usr/bin/pulseaudio --system --verbose --log-target=stderr --realtime=true --disallow-exit -L \"module-native-protocol-tcp auth-ip-acl=127.0.0.0/8 port=4713 auth-anonymous=1\""
environment=DISPLAY=":0"
# Same bogus options here, but pulseaudio --verbose would flood the pod log, so
# send it to a real file using the option name that actually works.
stdout_logfile=/tmp/pulseaudio.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=1
stopsignal=INT
autostart=true
autorestart=true
redirect_stderr=true
priority=10

